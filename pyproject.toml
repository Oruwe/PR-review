[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prflagger"
version = "0.1.0"
description = "An always-on pull-request verification service that reports facts with evidence"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "boto3",
    "fastapi",
    "httpx",
    "jinja2",
    "networkx",
    "numpy",
    "structlog",
    "uvicorn[standard]",
]

[project.scripts]
prflagger = "prflagger.cli:main"

[project.optional-dependencies]
embed = ["sentence-transformers"]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy", "types-networkx"]

[tool.setuptools.packages.find]
include = ["prflagger*"]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "T20"]

[tool.ruff.lint.per-file-ignores]
"prflagger/cli.py" = ["T20"]
"tests/*" = ["T20"]
"scripts/*" = ["T20", "S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["prflagger"]

[[tool.mypy.overrides]]
module = [
    "boto3.*",
    "botocore.*",
    "sentence_transformers.*",
    "structlog.*",
    "networkx.*",
    "numpy.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

# Everything the service reads from its own package at run time. Without these a
# regular (non-editable) install cannot create its database or render a page.
[tool.setuptools.package-data]
prflagger = [
    "report/app.html",
    "storage/schema.sql",
    "web/templates/*.html",
    "web/static/**/*",
]
