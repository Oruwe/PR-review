name: CI

on:
  push:
    branches: [main]
  pull_request:

# CLAUDE.md is non-negotiable: never mock Docker, git, or the target repo. So this
# workflow does not split off a "fast" job that skips the sandbox tests — it runs
# the real suite, in one job, the same way `pytest tests/ -x -q` does locally.
# GitHub-hosted ubuntu runners ship Docker Engine already running, and have normal
# internet access to Docker Hub, PyPI and GitHub — none of the registry-mirror or
# host-binary staging this repo's session-start hook does for its own sandboxed dev
# container are needed here.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install
        run: pip install -e ".[dev,embed]"

      - name: ruff
        run: ruff check .

      - name: mypy
        run: mypy prflagger/

      - name: Docker sanity
        run: docker info

      - name: pytest
        run: pytest tests/ -q
