name: CI

on:
  push:
    branches: [main]
  pull_request:

# CLAUDE.md is non-negotiable: never mock Docker, git, or the repo under analysis.
# So this workflow runs real containers against a real git repository. GitHub-hosted
# ubuntu runners ship Docker Engine already running and have normal internet access,
# so none of the registry-mirror or host-binary staging this repo's session-start
# hook does for its own sandboxed dev container is needed here.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install
        run: pip install -e ".[dev,embed]"

      - name: ruff
        run: ruff check .

      - name: mypy
        run: mypy prflagger/

      - name: Docker sanity
        run: docker info

      # The v2 suites build their own repository and run their own containers, so
      # they need no seeding and no network beyond the base image. Running them
      # first means a regression in the service surfaces before the slower,
      # network-dependent v1 fixtures get a chance to fail for their own reasons.
      - name: v2 suites
        run: pytest tests/test_v2_*.py tests/test_models.py -q

      - name: Clone the target repo
        run: python3 -c "from prflagger.vcs.worktrees import bare_clone; bare_clone('pallets/click')"

      - name: Seed the target repo's demo branches
        # test_cli, test_differential, test_probes and test_report require these and
        # fail with a named, non-cryptic error without them.
        run: python -m scripts.seed_target

      - name: Full suite
        run: pytest tests/ -q
