name: CI

on:
  push:
    branches: [main]
  pull_request:

# CLAUDE.md is non-negotiable: never mock Docker, git, or the target repo. So this
# workflow does not split off a "fast" job that skips the sandbox tests — it runs
# the real suite, in one job, the same way `pytest tests/ -x -q` does locally.
# GitHub-hosted ubuntu runners ship Docker Engine already running, and have normal
# internet access to Docker Hub, PyPI and GitHub — none of the registry-mirror or
# host-binary staging this repo's session-start hook does for its own sandboxed dev
# container are needed here.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install
        run: pip install -e ".[dev,embed]"

      - name: ruff
        run: ruff check .

      - name: mypy
        run: mypy prflagger/

      - name: Docker sanity
        run: docker info

      - name: Clone the target repo
        # seed_target.py refuses to run without this clone already present — on a
        # fresh checkout nothing has made it yet. Locally it usually already
        # exists from earlier fixture runs, which is exactly the kind of local
        # state this workflow can't assume.
        run: python3 -c "from prflagger.sandbox.runner import bare_clone; bare_clone('pallets/click')"

      - name: Seed the target repo's demo branches
        # A large slice of the suite (test_cli, test_differential, test_probes,
        # test_report) requires these and fails with a named, non-cryptic error
        # without them — README documents this as a precondition, but nothing
        # in this workflow had actually run it.
        run: python -m scripts.seed_target

      - name: pytest
        run: pytest tests/ -q
