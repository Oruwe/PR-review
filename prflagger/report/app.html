<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PR Flagger</title>
<style>
:root {
  --bg: #0D0B09;
  --surface: #16130F;
  --surface-2: #1F1A15;
  --text: #F2EDE6;
  --text-dim: #A79C8E;
  --line: #2A241D;
  --orange: #FFA55C;
  --orange-dim: #6B4028;
  --red: #FF6B5C;
  --green: #5CD6A0;

  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --pad: 28px;
  --radius: 12px;
}

* { box-sizing: border-box; }

html { background: var(--bg); }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.55 var(--sans);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -0.015em; }

a { color: var(--orange); text-decoration: none; border-bottom: 1px solid var(--orange-dim); }
a:hover { border-bottom-color: var(--orange); }

button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

code, pre, .mono { font-family: var(--mono); font-variant-ligatures: none; }

.num { font-variant-numeric: tabular-nums; }

.shell { max-width: 1320px; margin: 0 auto; padding: 0 32px 96px; }

/* ---------------------------------------------------------------- masthead */

.masthead {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 22px 56px;
  align-items: end;
  padding: 36px 0 20px;
  border-bottom: 1px solid var(--line);
}

.brand {
  display: flex;
  align-items: baseline;
  gap: 14px;
  flex-wrap: wrap;
}

.brand h1 { font-size: 30px; }

.brand .mark {
  width: 13px; height: 13px; border-radius: 3px;
  background: var(--orange);
  box-shadow: 0 0 0 4px rgba(255, 165, 92, 0.13);
  align-self: center;
}

.brand .repo {
  font-family: var(--mono);
  font-size: 15px;
  color: var(--text-dim);
  padding-left: 14px;
  border-left: 1px solid var(--line);
}

.claim {
  margin: 8px 0 0;
  font-size: 15.5px;
  color: var(--text-dim);
  max-width: 62ch;
}

.claim b { color: var(--text); font-weight: 600; }

.topline {
  display: grid;
  grid-template-columns: repeat(3, minmax(96px, auto));
  gap: 16px 30px;
  margin: 0;
  justify-items: start;
}

.topline div { display: flex; flex-direction: column; gap: 1px; }

.topline dt {
  order: 2;
  font-size: 10.5px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-dim);
  max-width: 14ch;
  line-height: 1.3;
}

.topline dd {
  order: 1;
  margin: 0;
  font-size: 23px;
  line-height: 1.15;
  font-variant-numeric: tabular-nums;
}

.topline dd em {
  font-style: normal;
  font-size: 14px;
  color: var(--text-dim);
}

.topline dd.small { font-size: 14.5px; padding-top: 5px; color: var(--text-dim); font-family: var(--mono); }

/* ------------------------------------------------------------------ zones */

.zone { padding: 42px 0 0; }

.zone-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 24px;
  flex-wrap: wrap;
  margin-bottom: 18px;
}

.zone-head h2 { font-size: 20px; }

.zone-head .kicker {
  font-size: 11.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--orange);
  display: block;
  margin-bottom: 5px;
}

.zone-note { color: var(--text-dim); font-size: 14px; max-width: 58ch; margin: 0; }

/* ------------------------------------------------------------------ filters */

.filters {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
  padding: 12px 0 20px;
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 7px 13px;
  border-radius: 999px;
  background: var(--surface);
  color: var(--text-dim);
  font-size: 13.5px;
  border: 1px solid transparent;
  transition: background 180ms ease-out, color 180ms ease-out;
}

.chip:hover { color: var(--text); background: var(--surface-2); }

.chip[aria-pressed="true"] {
  background: var(--surface-2);
  color: var(--text);
  border-color: var(--orange-dim);
}

.chip .dot { width: 9px; height: 9px; border-radius: 50%; background: currentColor; }

.chip .count { font-variant-numeric: tabular-nums; color: var(--text-dim); }

.chip[aria-pressed="true"] .count { color: var(--text); }

.k-behavior_change { color: var(--red); }
.k-api_change { color: var(--orange); }
.k-coverage_gap { color: #8FB8FF; }
.k-lint_regression { color: var(--text-dim); }
.k-timeout, .k-oom { color: var(--red); }

/* ------------------------------------------------------------------- flags */

.flags { display: flex; flex-direction: column; gap: 10px; }

.flag {
  position: relative;
  background: var(--surface);
  border-radius: var(--radius);
  overflow: hidden;
  scroll-margin-top: 16px;
}

.flag::before {
  content: "";
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: currentColor;
  opacity: 0.85;
}

.flag.is-open { background: var(--surface-2); }

.flag-btn {
  width: 100%;
  display: grid;
  grid-template-columns: 26px 1fr auto;
  gap: 4px 16px;
  align-items: start;
  padding: 18px 22px 18px 20px;
  text-align: left;
}

.flag-btn:hover .what { color: var(--text); }

.caret {
  width: 22px; height: 22px;
  display: grid; place-items: center;
  color: var(--text-dim);
  transition: transform 200ms ease-out, color 200ms ease-out;
}

.flag.is-open .caret { transform: rotate(90deg); color: var(--orange); }

.flag-main { min-width: 0; }

.flag-kind {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 11.5px;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  font-weight: 600;
}

.flag-kind .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }

.flag-kind .node-tag {
  color: var(--text-dim);
  letter-spacing: 0.06em;
  font-weight: 500;
  padding-left: 9px;
  border-left: 1px solid var(--line);
}

.sym {
  font-family: var(--mono);
  font-size: 15px;
  color: var(--text);
  margin: 7px 0 0;
  overflow-wrap: anywhere;
  line-height: 1.4;
}

.what {
  margin: 5px 0 0;
  color: var(--text-dim);
  font-size: 14.5px;
  transition: color 180ms ease-out;
  overflow-wrap: anywhere;
}

.where {
  margin: 7px 0 0;
  font-family: var(--mono);
  font-size: 12.5px;
  color: var(--text-dim);
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
}

.where span.sep { color: var(--line); }

.metrics {
  display: flex;
  gap: 18px;
  align-items: center;
  padding-top: 2px;
}

.metric { text-align: right; }

.metric .v {
  display: block;
  font-size: 17px;
  font-variant-numeric: tabular-nums;
  line-height: 1.2;
}

.metric .l {
  display: block;
  font-size: 10.5px;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-top: 2px;
}

.meter {
  width: 46px; height: 4px; border-radius: 2px;
  background: var(--line);
  margin: 6px 0 0 auto;
  overflow: hidden;
}

.meter i { display: block; height: 100%; background: currentColor; }

/* expanded body */

.flag-body { display: none; padding: 0 22px 22px 20px; }

.flag.is-open .flag-body { display: block; }

@media (prefers-reduced-motion: no-preference) {
  .flag.is-open .flag-body { animation: unfold 240ms ease-out; }
}

@keyframes unfold {
  from { opacity: 0; transform: translateY(-4px); }
  to { opacity: 1; transform: none; }
}

.field { border-top: 1px solid var(--line); padding: 16px 0 0; margin-top: 4px; }

.field + .field { margin-top: 16px; }

.field h4 {
  margin: 0 0 8px;
  font-size: 11.5px;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--text-dim);
  font-weight: 600;
}

pre.evidence {
  margin: 0;
  padding: 14px 16px;
  background: var(--bg);
  border-radius: 8px;
  font-size: 13px;
  line-height: 1.5;
  color: var(--text);
  overflow-x: auto;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  max-height: 340px;
  overflow-y: auto;
}

.evidence-cap {
  margin: 12px 0 6px;
  font-size: 12.5px;
  color: var(--text-dim);
  font-family: var(--mono);
}

pre.evidence.source { color: var(--text-dim); font-size: 12.5px; max-height: 260px; }

pre.evidence.source::selection { color: var(--text); }

.norm-statement {
  margin: 0;
  font-size: 15.5px;
  color: var(--text);
}

.norm-meta {
  display: flex;
  gap: 8px 20px;
  flex-wrap: wrap;
  margin: 10px 0 0;
  font-size: 13.5px;
  color: var(--text-dim);
}

.norm-meta span.num { color: var(--text); }

.cite { margin: 10px 0 0; font-size: 14.5px; color: var(--text-dim); }

.cite a { margin-right: 2px; }

.no-norm {
  margin: 0;
  font-size: 14.5px;
  color: var(--text-dim);
  border-left: 2px solid var(--orange-dim);
  padding-left: 14px;
}

.facts {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(132px, 1fr));
  gap: 12px 20px;
  margin: 0;
}

.facts div { min-width: 0; }

.facts dt {
  font-size: 10.5px;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--text-dim);
}

.facts dd {
  margin: 3px 0 0;
  font-size: 14px;
  font-family: var(--mono);
  overflow-wrap: anywhere;
}

.pill {
  display: inline-block;
  padding: 2px 9px;
  border-radius: 999px;
  font-size: 12px;
  font-family: var(--mono);
  background: var(--bg);
  color: var(--text-dim);
}

.pill.passed { color: var(--green); }
.pill.failed, .pill.timeout, .pill.oom, .pill.install_failed, .pill.collection_error { color: var(--red); }

.empty {
  padding: 34px 26px;
  background: var(--surface);
  border-radius: var(--radius);
  color: var(--text-dim);
  font-size: 15px;
  max-width: 70ch;
}

/* ------------------------------------------------------------------ footer */

.footer { margin-top: 56px; padding-top: 26px; border-top: 1px solid var(--line); }

.footer h2 { font-size: 17px; margin-bottom: 14px; }

.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 34px; }

table.plain { border-collapse: collapse; width: 100%; font-size: 14px; }

table.plain td { padding: 7px 14px 7px 0; vertical-align: top; border-bottom: 1px solid var(--line); }

table.plain td.k { color: var(--text); white-space: nowrap; font-family: var(--mono); font-size: 13px; }

table.plain td.v { color: var(--text-dim); }

.skipped td.k { color: var(--text-dim); }

.legal { margin-top: 26px; font-size: 13px; color: var(--text-dim); max-width: 86ch; }

@media (max-width: 900px) {
  .two-col { grid-template-columns: 1fr; gap: 26px; }
}

@media (max-width: 620px) {
  .shell { padding: 0 16px 64px; }
  .masthead { padding-top: 28px; }
  .brand h1 { font-size: 24px; }
  .brand .repo { padding-left: 0; border-left: 0; }
  .topline { gap: 22px; }
  .topline dd { font-size: 21px; }
  .flag-btn { grid-template-columns: 20px 1fr; padding: 15px 16px 15px 14px; }
  .metrics { grid-column: 2; justify-content: flex-start; padding-top: 10px; }
  .metric { text-align: left; }
  .meter { margin-left: 0; }
  .flag-body { padding: 0 16px 18px 14px; }
}
</style>
</head>
<body>
<div class="shell">

  <header class="masthead">
    <div>
      <div class="brand">
        <span class="mark"></span>
        <h1>PR Flagger</h1>
        <span class="repo" id="repo-name">—</span>
      </div>
      <p class="claim" id="claim"></p>
    </div>
    <dl class="topline" id="topline"></dl>
  </header>

  <section class="zone" id="zone-flags">
    <div class="zone-head">
      <div>
        <span class="kicker">Zone 2 · Flags</span>
        <h2>What changed, and how we know</h2>
      </div>
      <p class="zone-note">Ranked by confidence &times; severity &times; centrality. Every
      flag carries the four fields or it is not emitted.</p>
    </div>
    <div class="filters" id="filters"></div>
    <div class="flags" id="flags"></div>
  </section>

  <section class="zone" id="zone-prs">
    <div class="zone-head">
      <div>
        <span class="kicker">Zone 3 · Analysed pull requests</span>
        <h2>Runs on this repository</h2>
      </div>
    </div>
    <div id="prs"></div>
  </section>

  <footer class="footer">
    <div class="two-col">
      <div>
        <h2>Coverage statement</h2>
        <p class="zone-note" id="coverage-line"></p>
        <table class="plain" id="coverage"></table>
      </div>
      <div>
        <h2>Where this data comes from</h2>
        <table class="plain" id="provenance"></table>
      </div>
    </div>
    <p class="legal" id="legal"></p>
  </footer>

</div>

<script>
"use strict";

const DATA = /*__PRFLAGGER_PAYLOAD__*/null;

/* ------------------------------------------------------------------ helpers */

const $ = (sel) => document.querySelector(sel);

const KIND_LABEL = {
  behavior_change: "behaviour change",
  api_change: "api change",
  coverage_gap: "coverage gap",
  lint_regression: "lint regression",
  timeout: "timeout",
  oom: "out of memory",
};

const NODE_LABEL = {};
(DATA.pipeline ? DATA.pipeline.nodes : []).forEach((node) => {
  NODE_LABEL[node.id] = node.component + " " + node.label;
});

function el(tag, attrs, children) {
  const node = document.createElement(tag);
  for (const key in attrs || {}) {
    const value = attrs[key];
    if (value === null || value === undefined || value === false) continue;
    if (key === "class") node.className = value;
    else if (key === "text") node.textContent = value;
    else node.setAttribute(key, value === true ? "" : String(value));
  }
  (children || []).forEach((child) => {
    if (child === null || child === undefined) return;
    node.appendChild(typeof child === "string" ? document.createTextNode(child) : child);
  });
  return node;
}

function fixed(value, places) {
  return Number(value || 0).toFixed(places === undefined ? 2 : places);
}

function prById(number) {
  return (DATA.prs || []).find((pr) => pr.number === number) || null;
}

function runById(id) {
  return (DATA.runs || []).find((run) => run.id === id) || null;
}

/* ----------------------------------------------------------------- masthead */

function renderMasthead() {
  const profile = DATA.profile || {};
  const counts = DATA.counts || {findings: 0, cited: 0, uncited: 0};
  $("#repo-name").textContent = profile.repo || "unknown repository";

  $("#claim").innerHTML = "";
  $("#claim").append(
    el("b", {text: "Observations, each with evidence."}),
    " This page never says approve, reject or looks fine. It reports what changed, how it" +
      " was measured, which standard of this repository makes it matter, and how confident" +
      " the measurement is."
  );

  const behaviour = (counts.by_kind || {}).behavior_change || 0;
  const discard = (DATA.validation || []).length
    ? Math.round(
        (DATA.validation.reduce((total, round) => total + round.discard_rate, 0) /
          DATA.validation.length) *
          100
      ) + "%"
    : "—";
  const rows = [
    ["Flags", String(counts.findings), null, null],
    ["Behaviour changes", String(behaviour), null, null],
    ["Citing a repo standard", String(counts.cited), " of " + counts.findings, null],
    ["Pull requests analysed", String((DATA.prs || []).length), null, null],
    ["Sandbox runs recorded", String((DATA.runs || []).length), null, null],
    ["Generated tests discarded on base", discard, null, null],
  ];
  const list = $("#topline");
  list.innerHTML = "";
  rows.forEach(([label, value, suffix, cls]) => {
    const dd = el("dd", {class: cls || null}, [value]);
    if (suffix) dd.appendChild(el("em", {text: suffix}));
    list.appendChild(el("div", {}, [dd, el("dt", {text: label})]));
  });
}

/* -------------------------------------------------------------------- flags */

const state = {kinds: new Set(), openFlags: new Set()};

function visibleFindings() {
  const findings = DATA.findings || [];
  if (state.kinds.size === 0) return findings;
  return findings.filter((finding) => state.kinds.has(finding.kind));
}

function renderFilters() {
  const bar = $("#filters");
  bar.innerHTML = "";
  const byKind = (DATA.counts || {}).by_kind || {};
  const kinds = Object.keys(byKind).sort((a, b) => byKind[b] - byKind[a]);

  bar.appendChild(
    el(
      "button",
      {
        class: "chip",
        "aria-pressed": state.kinds.size === 0,
        onclick: "",
        "data-kind": "",
      },
      [el("span", {text: "All"}), el("span", {class: "count num", text: String((DATA.findings || []).length)})]
    )
  );

  kinds.forEach((kind) => {
    bar.appendChild(
      el(
        "button",
        {
          class: "chip k-" + kind,
          "aria-pressed": state.kinds.has(kind),
          "data-kind": kind,
        },
        [
          el("span", {class: "dot"}),
          el("span", {text: KIND_LABEL[kind] || kind}),
          el("span", {class: "count num", text: String(byKind[kind])}),
        ]
      )
    );
  });

  bar.querySelectorAll("button").forEach((button) => {
    button.addEventListener("click", () => {
      const kind = button.getAttribute("data-kind");
      if (!kind) state.kinds.clear();
      else if (state.kinds.has(kind)) state.kinds.delete(kind);
      else state.kinds.add(kind);
      renderFilters();
      renderFlags();
    });
  });
}

function flagCard(finding) {
  const open = state.openFlags.has(finding.id);
  const card = el("article", {
    class: "flag k-" + finding.kind + (open ? " is-open" : ""),
    id: "flag-" + finding.id,
    "data-node": finding.node,
  });

  const header = el("button", {class: "flag-btn", "aria-expanded": open}, [
    el("span", {class: "caret"}, [caretIcon()]),
    el("span", {class: "flag-main"}, [
      el("span", {class: "flag-kind"}, [
        el("span", {class: "dot"}),
        el("span", {text: KIND_LABEL[finding.kind] || finding.kind}),
        el("span", {class: "node-tag", text: NODE_LABEL[finding.node] || finding.node}),
      ]),
      el("p", {class: "sym", text: finding.symbol}),
      el("p", {class: "what", text: observation(finding)}),
      whereLine(finding),
    ]),
    el("span", {class: "metrics"}, [
      el("span", {class: "metric"}, [
        el("span", {class: "v", text: fixed(finding.confidence)}),
        el("span", {class: "l", text: "confidence"}),
        meter(finding.confidence),
      ]),
      el("span", {class: "metric"}, [
        el("span", {class: "v", text: fixed(finding.severity)}),
        el("span", {class: "l", text: "severity"}),
        meter(finding.severity),
      ]),
    ]),
  ]);

  header.addEventListener("click", () => {
    if (state.openFlags.has(finding.id)) state.openFlags.delete(finding.id);
    else state.openFlags.add(finding.id);
    const isOpen = state.openFlags.has(finding.id);
    card.classList.toggle("is-open", isOpen);
    header.setAttribute("aria-expanded", String(isOpen));
  });

  card.appendChild(header);
  card.appendChild(flagBody(finding));
  return card;
}

/* The probes name the symbol inside the observation, and the card already shows it as
   its heading; repeating it twice reads as a stutter. The text itself is untouched. */
function observation(finding) {
  const text = finding.what_changed;
  if (text.startsWith(finding.symbol + " ")) return text.slice(finding.symbol.length + 1);
  if (text.startsWith(finding.symbol + ":")) return text.slice(finding.symbol.length + 1).trim();
  return text;
}

function whereLine(finding) {
  const where = finding.where || {};
  const line = el("p", {class: "where"});
  const bits = [];
  if (finding.pr) {
    bits.push(
      el("a", {href: prUrl(finding.pr), target: "_blank", rel: "noopener", text: "#" + finding.pr})
    );
  }
  if (where.file) {
    const label = where.file + (where.line_start ? ":" + where.line_start : "");
    bits.push(
      where.url
        ? el("a", {href: where.url, target: "_blank", rel: "noopener", text: label})
        : el("span", {text: label})
    );
  }
  if (finding.run) {
    const run = runById(finding.run);
    if (run) bits.push(el("span", {class: "pill " + run.outcome, text: run.outcome}));
  }
  bits.forEach((bit, index) => {
    if (index) line.appendChild(el("span", {class: "sep", text: "/"}));
    line.appendChild(bit);
  });
  return bits.length ? line : null;
}

function caretIcon() {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 16 16");
  svg.setAttribute("width", "13");
  svg.setAttribute("height", "13");
  svg.setAttribute("aria-hidden", "true");
  const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
  path.setAttribute("d", "M5 2.5 L11 8 L5 13.5");
  path.setAttribute("fill", "none");
  path.setAttribute("stroke", "currentColor");
  path.setAttribute("stroke-width", "1.8");
  path.setAttribute("stroke-linecap", "round");
  path.setAttribute("stroke-linejoin", "round");
  svg.appendChild(path);
  return svg;
}

function meter(value) {
  return el("span", {class: "meter"}, [
    el("i", {style: "width:" + Math.round(Math.max(0, Math.min(1, value)) * 100) + "%"}),
  ]);
}

function flagBody(finding) {
  const body = el("div", {class: "flag-body"});

  const evidence = el("div", {class: "field"}, [
    el("h4", {text: "How we know"}),
    el("pre", {class: "evidence", text: finding.how_we_know}),
  ]);
  const where = finding.where || {};
  if (where.excerpt) {
    evidence.appendChild(
      el("p", {class: "evidence-cap"}, [
        "The code it refers to, at head: ",
        where.url
          ? el("a", {
              href: where.url,
              target: "_blank",
              rel: "noopener",
              text: where.file + ":" + where.line_start + "-" + where.line_end,
            })
          : el("span", {text: where.file}),
      ])
    );
    evidence.appendChild(el("pre", {class: "evidence source", text: where.excerpt}));
  }
  body.appendChild(evidence);

  const normField = el("div", {class: "field"}, [el("h4", {text: "Repo standard"})]);
  if (finding.norm) {
    normField.appendChild(el("p", {class: "norm-statement", text: "“" + finding.norm.statement + "”"}));
    const meta = el("p", {class: "norm-meta"});
    const mined = finding.norm.support > 0 || finding.norm.distinct_reviewers > 0;
    if (mined) {
      meta.append(
        el("span", {}, [el("span", {class: "num", text: String(finding.norm.support)}), " enforcing review comments"]),
        el("span", {}, [el("span", {class: "num", text: String(finding.norm.distinct_reviewers)}), " distinct reviewers"]),
        el("span", {}, ["scope ", el("span", {class: "num", text: finding.norm.scope})]),
        el("span", {}, ["norm confidence ", el("span", {class: "num", text: fixed(finding.norm.confidence)})])
      );
    } else {
      meta.append(
        el("span", {}, ["declared, not mined — ", el("span", {class: "num", text: declaredSource(finding.norm.id)})]),
        el("span", {}, ["scope ", el("span", {class: "num", text: finding.norm.scope})])
      );
    }
    normField.appendChild(meta);
    normField.appendChild(citation(finding));
  } else {
    normField.appendChild(
      el("p", {
        class: "no-norm",
        text:
          "No repo standard is cited, and none is required: a behaviour recorded on base " +
          "that no longer holds at head is a fact about this diff on its own.",
      })
    );
  }
  body.appendChild(normField);

  const run = runById(finding.run);
  const pr = prById(finding.pr);
  const facts = el("dl", {class: "facts"});
  facts.append(
    fact("Produced by", NODE_LABEL[finding.node] || finding.node),
    fact("Pull request", pr ? "#" + pr.number + " " + pr.author : "—"),
    fact("Head commit", pr ? pr.head.slice(0, 10) : "—")
  );
  if (run) {
    facts.append(
      fact("Sandbox outcome", run.outcome, "pill " + run.outcome),
      fact("Wall time", run.wall_s + "s"),
      fact("Memory cap", run.memory_mb + " MB"),
      fact("Network", "disabled")
    );
  }
  body.appendChild(el("div", {class: "field"}, [el("h4", {text: "Provenance"}), facts]));
  return body;
}

function fact(label, value, pillClass) {
  return el("div", {}, [
    el("dt", {text: label}),
    el("dd", {}, [pillClass ? el("span", {class: pillClass, text: value}) : document.createTextNode(value)]),
  ]);
}

function citation(finding) {
  const norm = finding.norm;
  const history = ((DATA.profile || {}).norm_history || {})[norm.id] || [];
  if (norm.evidence_prs && norm.evidence_prs.length) {
    const line = el("p", {class: "cite"}, ["This repo required this in "]);
    norm.evidence_prs.forEach((number, index) => {
      const url = (finding.evidence_urls || {})[String(number)] || prUrl(number);
      line.appendChild(el("a", {href: url, target: "_blank", rel: "noopener", text: "#" + number}));
      if (index < norm.evidence_prs.length - 1) line.appendChild(document.createTextNode(", "));
    });
    line.appendChild(document.createTextNode("."));
    return line;
  }
  if (history.length) {
    const line = el("p", {class: "cite"}, [
      "Declared by the repository's own configuration. The declaration itself was last changed in ",
    ]);
    history.forEach((row, index) => {
      line.appendChild(
        el("a", {href: row.url, target: "_blank", rel: "noopener", text: "#" + row.pr, title: row.title})
      );
      if (index < history.length - 1) line.appendChild(document.createTextNode(", "));
    });
    line.appendChild(document.createTextNode("."));
    return line;
  }
  return el("p", {class: "cite", text: "Declared by the repository's own configuration."});
}

/* Which file in the repository declares this standard. The Brain keeps the declared
   config separately from the mined norms, so this is a lookup, not a guess. */
function declaredSource(normId) {
  const declared = (DATA.profile || {}).declared || {};
  const history = ((DATA.profile || {}).norm_history || {})[normId] || [];
  if (history.length && history[0].file) return history[0].file;
  if (normId.indexOf("ruff") !== -1 && declared.linter) return declared.linter + " config";
  if (normId.indexOf("types") !== -1 && declared.type_checker) return declared.type_checker + " config";
  return "the repository's own config";
}

function prUrl(number) {
  const repo = (DATA.profile || {}).repo;
  return repo ? "https://github.com/" + repo + "/pull/" + number : "#";
}

function renderFlags() {
  const host = $("#flags");
  host.innerHTML = "";
  const findings = visibleFindings();
  if (!findings.length) {
    host.appendChild(
      el("p", {
        class: "empty",
        text:
          "No flags match this filter. That is not an approval: it means nothing in this " +
          "selection was measured as changed. The coverage statement below says what was " +
          "checked and what was not.",
      })
    );
    return;
  }
  findings.forEach((finding) => host.appendChild(flagCard(finding)));
}

/* ---------------------------------------------------------------------- prs */

function renderPrs() {
  const host = $("#prs");
  host.innerHTML = "";
  const prs = DATA.prs || [];
  if (!prs.length) {
    host.appendChild(el("p", {class: "empty", text: "No pull requests have been analysed in this run."}));
    return;
  }
  const table = el("table", {class: "plain"});
  prs.forEach((pr) => {
    table.appendChild(
      el("tr", {}, [
        el("td", {class: "k", text: "#" + pr.number}),
        el("td", {class: "v"}, [
          el("div", {text: pr.title}),
          el("div", {
            class: "mono",
            style: "font-size:12.5px;color:var(--text-dim);margin-top:3px",
            text:
              pr.author +
              " · " +
              (pr.merged_at || "").slice(0, 10) +
              " · +" +
              pr.insertions +
              "/-" +
              pr.deletions +
              " · " +
              pr.finding_ids.length +
              " flag(s)",
          }),
        ]),
      ])
    );
  });
  host.appendChild(table);
}

/* ------------------------------------------------------------------- footer */

function renderFooter() {
  const coverage = ((DATA.profile || {}).coverage) || {verified: [], skipped: []};
  const verified = coverage.verified || [];
  const skipped = coverage.skipped || [];
  $("#coverage-line").textContent =
    "Verified " + verified.length + " of " + (verified.length + skipped.length) +
    " areas. What was skipped is named, never implied.";

  const table = $("#coverage");
  table.innerHTML = "";
  verified.forEach((row) => {
    table.appendChild(
      el("tr", {}, [el("td", {class: "k", text: row.module}), el("td", {class: "v", text: row.detail})])
    );
  });
  skipped.forEach((row) => {
    table.appendChild(
      el("tr", {class: "skipped"}, [
        el("td", {class: "k", text: row.module}),
        el("td", {class: "v", text: "skipped — " + row.reason}),
      ])
    );
  });

  const prov = $("#provenance");
  prov.innerHTML = "";
  (DATA.provenance || []).forEach((row) => {
    prov.appendChild(
      el("tr", {}, [
        el("td", {class: "k", text: row.dataset}),
        el("td", {class: "v"}, [
          el("div", {text: row.source}),
          el("div", {style: "color:var(--text-dim);margin-top:2px", text: row.detail}),
        ]),
      ])
    );
  });

  $("#legal").textContent =
    "PR Flagger runs mechanical probes and reports facts. It does not review code, score a " +
    "pull request, or recommend a decision. Where it could not measure something, it says so. " +
    "This page was generated from " +
    ((DATA.profile || {}).repo || "the target repository") +
    " at " +
    (DATA.generated_at || "").replace("T", " ").replace("Z", " UTC") +
    " and contains no network requests.";
}

/* --------------------------------------------------------------------- boot */

renderMasthead();
renderFilters();
renderFlags();
renderPrs();
renderFooter();
</script>
</body>
</html>
